sentence=A lightweight, non-blocking OLED animation and UI library for Arduino.
paragraph=OLEDAnimator brings 128x64 SSD1306/SH1106 OLED displays to life using non-blocking millis() frame loops. Features include procedural expressive robot faces, progress loaders, smooth UI page transitions, and bitmap sprite animation playback without freezing loop execution.
